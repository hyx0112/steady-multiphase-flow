[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "steady-multiphase-flow"
version = "0.1.0"
description = "Steady-state multiphase pipe flow simulator with a paper-faithful closure library"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "steady-multiphase-flow contributors" }]
keywords = ["multiphase flow", "pipeline", "pressure gradient", "holdup", "flow pattern", "closures"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Physics",
    "Intended Audience :: Science/Research",
]
dependencies = ["numpy>=1.23", "pandas>=1.5"]

[project.optional-dependencies]
plots = ["matplotlib>=3.5"]
pvt = ["thermo>=0.2"]

[project.urls]
Repository = "https://github.com/hyx0112/steady-multiphase-flow"

[tool.setuptools]
packages = ["steady", "closures"]
